<app-controls
  [dateOptions]="dateOptions"
  (loadStart)="dataLoaded = false"
  (refresh)="onRefresh($event)"
  (searchChange)="onSearch($event)"
  (dateChange)="onDate($event)">
</app-controls>
<app-stats
  [totalSongs]="songs.length"
  [withChords]="getSongsWithChords()"
  [withVideo]="getSongsWithVideo()">
</app-stats>
<div id="main">
  <div *ngIf="!dataLoaded" class="loading"><div class="spinner"></div><p>Cargando canciones...</p></div>
  <div *ngIf="dataLoaded && songs.length === 0" class="empty">🎵<br><br>No hay canciones que coincidan</div>
  <app-song-card-group *ngIf="dataLoaded" [songs]="songs"></app-song-card-group>
</div>
