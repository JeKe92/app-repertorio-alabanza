<div class="controls">
    <div class="search-wrap">
        <span class="material-icons search-icon" aria-hidden="true">search</span>
        <input type="search" id="search" placeholder="Buscar canción..." (input)="filterBySongName($event)">
    </div>
    <div class="sel-wrap">
        <select id="fdate" (change)="filterByDate($event)">
            <option value="">Todas las fechas</option>
            <option *ngFor="let d of dateOptions" [value]="d">{{d}}</option>
        </select>
    </div>
        <button class="icon-btn" (click)="load()" title="Actualizar"><span class="material-icons"
            aria-hidden="true">refresh</span></button>
    <!-- Theme toggle -->
    <button id="theme-toggle" class="icon-btn" title="Cambiar tema">
        <span class="material-icons" id="theme-icon">light_mode</span>
    </button>
</div>
